# Build the site with build.sh and publish it to GitHub Pages on every push to main.
#
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push replace a deploy that hasn't started yet, but never cancel one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Ubuntu's own pandoc is too old for --syntax-highlighting, so install the version
      # used locally from pandoc's releases.
      - name: Install pandoc
        run: |
          curl -sSLo pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo dpkg -i pandoc.deb
          rm pandoc.deb

      - name: Build
        run: ./build.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
