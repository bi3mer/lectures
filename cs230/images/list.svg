<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" role="img" aria-label="The name scores points to one list holding 90, 85, 77, 100, and 68, in order">
  <!-- Colors: Sanzo Wada combination 151 (see themes/cs230-theme.css) -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f99d1b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="178" rx="16" fill="#032837" stroke="#38728b" stroke-width="2"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="40" text-anchor="middle">
    <!-- the name -->
    <text x="104" y="104" fill="#f5ecc2">scores</text>
    <line x1="192" y1="90" x2="254" y2="90" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>

    <!-- the list: one row of five items -->
    <g fill="#064f6e" stroke="#a8c1cc" stroke-width="3">
      <rect x="262" y="40" width="128" height="100"/>
      <rect x="390" y="40" width="128" height="100"/>
      <rect x="518" y="40" width="128" height="100"/>
      <rect x="646" y="40" width="128" height="100"/>
      <rect x="774" y="40" width="128" height="100"/>
    </g>
    <g fill="#f5ecc2">
      <text x="326" y="104">90</text>
      <text x="454" y="104">85</text>
      <text x="582" y="104">77</text>
      <text x="710" y="104">100</text>
      <text x="838" y="104">68</text>
    </g>
  </g>
</svg>
