<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-label="names starts as &quot;Ada&quot;, &quot;Grace&quot;. insert(0, &quot;Alan&quot;) puts &quot;Alan&quot; at the front and moves the others right. insert(2, &quot;Linus&quot;) puts &quot;Linus&quot; between &quot;Ada&quot; and &quot;Grace&quot;.">
  <!-- Colors: Sanzo Wada combination 151 (see themes/cs230-theme.css) -->
  <rect x="1" y="1" width="558" height="348" rx="16" fill="#032837" stroke="#38728b" stroke-width="2"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
    <!-- step 1: the starting list -->
    <text x="24" y="44" font-size="22" fill="#a8c1cc">names = ["Ada", "Grace"]</text>
    <g fill="#064f6e" stroke="#a8c1cc" stroke-width="3">
      <rect x="24" y="58" width="110" height="56"/>
      <rect x="134" y="58" width="140" height="56"/>
    </g>
    <g font-size="26" fill="#f5ecc2" text-anchor="middle">
      <text x="79" y="95">"Ada"</text>
      <text x="204" y="95">"Grace"</text>
    </g>

    <!-- step 2: insert at index 0 -->
    <text x="24" y="150" font-size="22" fill="#a8c1cc">names.insert(0, "Alan")</text>
    <g fill="#064f6e" stroke-width="3">
      <rect x="144" y="164" width="110" height="56" stroke="#a8c1cc"/>
      <rect x="254" y="164" width="140" height="56" stroke="#a8c1cc"/>
      <!-- drawn last so its orange edge sits on top -->
      <rect x="24" y="164" width="120" height="56" stroke="#f99d1b"/>
    </g>
    <g font-size="26" fill="#f5ecc2" text-anchor="middle">
      <text x="84" y="201">"Alan"</text>
      <text x="199" y="201">"Ada"</text>
      <text x="324" y="201">"Grace"</text>
    </g>

    <!-- step 3: insert at index 2 -->
    <text x="24" y="256" font-size="22" fill="#a8c1cc">names.insert(2, "Linus")</text>
    <g fill="#064f6e" stroke-width="3">
      <rect x="24" y="270" width="120" height="56" stroke="#a8c1cc"/>
      <rect x="144" y="270" width="110" height="56" stroke="#a8c1cc"/>
      <rect x="394" y="270" width="140" height="56" stroke="#a8c1cc"/>
      <!-- drawn last so its orange edge sits on top -->
      <rect x="254" y="270" width="140" height="56" stroke="#f99d1b"/>
    </g>
    <g font-size="26" fill="#f5ecc2" text-anchor="middle">
      <text x="84" y="307">"Alan"</text>
      <text x="199" y="307">"Ada"</text>
      <text x="324" y="307">"Linus"</text>
      <text x="464" y="307">"Grace"</text>
    </g>
  </g>
</svg>
