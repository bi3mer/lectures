<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" role="img" aria-label="The first time around the loop, x gets 1, the first item of nums. After x = x * 2, x is 2, but nums is still 1, 2, 3.">
  <!-- Colors: Sanzo Wada combination 151 (see themes/cs230-theme.css) -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f99d1b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="538" height="398" rx="16" fill="#032837" stroke="#38728b" stroke-width="2"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
    <!-- step 1: x gets the first item -->
    <text x="24" y="40" font-size="22" fill="#a8c1cc">for x in nums:</text>

    <text x="120" y="90" font-size="26" fill="#f5ecc2" text-anchor="end">nums</text>
    <g fill="#064f6e" stroke-width="3">
      <rect x="206" y="56" width="70" height="50" stroke="#a8c1cc"/>
      <rect x="276" y="56" width="70" height="50" stroke="#a8c1cc"/>
      <!-- drawn last so its orange edge sits on top -->
      <rect x="136" y="56" width="70" height="50" stroke="#f99d1b"/>
    </g>
    <g font-size="26" fill="#f5ecc2" text-anchor="middle">
      <text x="171" y="90">1</text>
      <text x="241" y="90">2</text>
      <text x="311" y="90">3</text>
    </g>

    <line x1="171" y1="108" x2="171" y2="134" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>

    <text x="120" y="170" font-size="26" fill="#f5ecc2" text-anchor="end">x</text>
    <rect x="136" y="136" width="70" height="50" fill="#064f6e" stroke="#f99d1b" stroke-width="3"/>
    <text x="171" y="170" font-size="26" fill="#f5ecc2" text-anchor="middle">1</text>
    <text x="222" y="168" font-size="20" fill="#f99d1b">← gets the first item</text>

    <!-- step 2: x = x * 2 changes only x -->
    <text x="24" y="232" font-size="22" fill="#a8c1cc">x = x * 2</text>

    <text x="120" y="282" font-size="26" fill="#f5ecc2" text-anchor="end">nums</text>
    <g fill="#064f6e" stroke="#a8c1cc" stroke-width="3">
      <rect x="136" y="248" width="70" height="50"/>
      <rect x="206" y="248" width="70" height="50"/>
      <rect x="276" y="248" width="70" height="50"/>
    </g>
    <g font-size="26" fill="#f5ecc2" text-anchor="middle">
      <text x="171" y="282">1</text>
      <text x="241" y="282">2</text>
      <text x="311" y="282">3</text>
    </g>
    <text x="362" y="280" font-size="20" fill="#a8c1cc">← unchanged</text>

    <text x="120" y="362" font-size="26" fill="#f5ecc2" text-anchor="end">x</text>
    <rect x="136" y="328" width="70" height="50" fill="#064f6e" stroke="#f99d1b" stroke-width="3"/>
    <text x="171" y="362" font-size="26" fill="#f5ecc2" text-anchor="middle">2</text>
    <text x="222" y="360" font-size="20" fill="#f99d1b">← changed</text>
  </g>
</svg>
