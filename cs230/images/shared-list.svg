<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="a and b both point to the same list, which holds 1, 2, 3, and 4. The 4 was added through b.">
  <!-- Colors: Sanzo Wada combination 151 (see themes/cs230-theme.css) -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f99d1b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="238" rx="16" fill="#032837" stroke="#38728b" stroke-width="2"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle">
    <!-- two names, one list -->
    <text x="150" y="94" font-size="40" fill="#f5ecc2" text-anchor="end">a</text>
    <text x="150" y="184" font-size="40" fill="#f5ecc2" text-anchor="end">b</text>
    <line x1="162" y1="80" x2="252" y2="112" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>
    <line x1="162" y1="170" x2="252" y2="148" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>

    <g fill="#064f6e" stroke-width="3">
      <rect x="260" y="90" width="80" height="80" stroke="#a8c1cc"/>
      <rect x="340" y="90" width="80" height="80" stroke="#a8c1cc"/>
      <rect x="420" y="90" width="80" height="80" stroke="#a8c1cc"/>
      <!-- drawn last so its orange edge sits on top -->
      <rect x="500" y="90" width="80" height="80" stroke="#f99d1b"/>
    </g>
    <g font-size="36" fill="#f5ecc2">
      <text x="300" y="143">1</text>
      <text x="380" y="143">2</text>
      <text x="460" y="143">3</text>
      <text x="540" y="143">4</text>
    </g>
    <text x="596" y="138" font-size="20" fill="#f99d1b" text-anchor="start">← b.append(4)</text>
  </g>
</svg>
