<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="scores holds 90, 85, 77, 100, and 68 at indexes 0 to 4. middle = scores[1:3] is a new list holding 85 and 77, the items at indexes 1 and 2. scores keeps all five.">
  <!-- Colors: Sanzo Wada combination 151 (see themes/cs230-theme.css) -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f99d1b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="298" rx="16" fill="#032837" stroke="#38728b" stroke-width="2"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle">
    <!-- the original list -->
    <text x="200" y="84" font-size="34" fill="#f5ecc2" text-anchor="end">scores</text>
    <line x1="210" y1="70" x2="254" y2="70" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>
    <g fill="#064f6e" stroke-width="3">
      <rect x="262" y="30" width="128" height="80" stroke="#a8c1cc"/>
      <rect x="646" y="30" width="128" height="80" stroke="#a8c1cc"/>
      <rect x="774" y="30" width="128" height="80" stroke="#a8c1cc"/>
      <!-- drawn last so their orange edges sit on top -->
      <rect x="390" y="30" width="128" height="80" stroke="#f99d1b"/>
      <rect x="518" y="30" width="128" height="80" stroke="#f99d1b"/>
    </g>
    <g font-size="34" fill="#f5ecc2">
      <text x="326" y="82">90</text>
      <text x="454" y="82">85</text>
      <text x="582" y="82">77</text>
      <text x="710" y="82">100</text>
      <text x="838" y="82">68</text>
    </g>

    <!-- indexes -->
    <g font-size="24" fill="#a8c1cc">
      <text x="326" y="146">0</text>
      <text x="454" y="146">1</text>
      <text x="582" y="146">2</text>
      <text x="710" y="146">3</text>
      <text x="838" y="146">4</text>
    </g>

    <!-- the slice: a new list -->
    <text x="328" y="244" font-size="34" fill="#f5ecc2" text-anchor="end">middle</text>
    <line x1="338" y1="230" x2="382" y2="230" stroke="#f99d1b" stroke-width="3" marker-end="url(#head)"/>
    <g fill="#064f6e" stroke="#f99d1b" stroke-width="3">
      <rect x="390" y="190" width="128" height="80"/>
      <rect x="518" y="190" width="128" height="80"/>
    </g>
    <g font-size="34" fill="#f5ecc2">
      <text x="454" y="242">85</text>
      <text x="582" y="242">77</text>
    </g>
    <text x="662" y="238" font-size="22" fill="#f99d1b" text-anchor="start">← a new list</text>
  </g>
</svg>
