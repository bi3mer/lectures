<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clear: left</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }

      .container {
        background: #f1efe8;
        border-radius: 8px;
        padding: 12px;
        line-height: 1.6;
        overflow: hidden; /* contains the floated children */
      }

      .box-left {
        float: left;
        width: 55px;
        height: 40px; /* short */
        margin: 0 8px 4px 0;
        background: #378add;
        color: #042c53;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .box-right {
        float: right;
        width: 55px;
        height: 110px; /* tall — extends down past the paragraph */
        margin: 0 0 4px 8px;
        background: #d85a30;
        color: #4a1b0c;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
      }

      .footer {
        clear: left; /* escapes the LEFT float only */
        margin: 0;
        padding: 6px;
        background: #97c459;
        color: #173404;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box-left">LEFT</div>
      <div class="box-right">TALL RIGHT</div>
      <p class="footer">
        clear: left — I dropped below the short LEFT float, but I'm still tucked
        up beside the tall RIGHT float.
      </p>
    </div>
  </body>
</html>
