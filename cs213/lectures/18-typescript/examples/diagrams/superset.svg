<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>JavaScript inside TypeScript</title>
  <desc>A large oval, TypeScript, holds a smaller oval, JavaScript. TypeScript is all of JavaScript, plus types.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="370" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="370" rx="18" fill="url(#grid)" />
  <ellipse cx="590" cy="185" rx="520" ry="160" fill="#1e3a5f" stroke="#38bdf8" stroke-width="3" />
  <ellipse cx="420" cy="195" rx="290" ry="112" fill="#0f1b2d" stroke="#facc15" stroke-width="3" />
  <text x="420" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">JavaScript</text>
  <text x="420" y="190" font-size="21" fill="#e2e8f0" text-anchor="middle">variables, functions, loops,</text>
  <text x="420" y="220" font-size="21" fill="#e2e8f0" text-anchor="middle">arrays, objects, the DOM</text>
  <text x="890" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
  <text x="890" y="190" font-size="21" fill="#e2e8f0" text-anchor="middle">all of JavaScript,</text>
  <text x="890" y="220" font-size="21" fill="#e2e8f0" text-anchor="middle">plus types</text>

</svg>
