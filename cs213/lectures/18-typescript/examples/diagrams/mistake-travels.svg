<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mistake travels</title>
  <desc>We misspell points. JavaScript gives undefined. Adding 10 gives NaN. NaN goes into the total. The page shows Total: NaN. There are no errors along the way.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="290" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="290" rx="18" fill="url(#grid)" />
  <rect x="24" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="3" />
  <text x="124.0" y="138" font-size="20" fill="#e2e8f0" text-anchor="middle">We misspell</text>
  <text x="124.0" y="166" font-size="20" fill="#e2e8f0" text-anchor="middle">&#8220;points&#8221;</text>
  <line x1="228" y1="145" x2="250" y2="145" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <rect x="256" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" />
  <text x="356.0" y="138" font-size="20" fill="#e2e8f0" text-anchor="middle">JavaScript says</text>
  <text x="356.0" y="166" font-size="20" fill="#e2e8f0" text-anchor="middle">&#8220;undefined&#8221;</text>
  <line x1="460" y1="145" x2="482" y2="145" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <rect x="488" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" />
  <text x="588.0" y="138" font-size="20" fill="#e2e8f0" text-anchor="middle">undefined + 10</text>
  <text x="588.0" y="166" font-size="20" fill="#e2e8f0" text-anchor="middle">is NaN</text>
  <line x1="692" y1="145" x2="714" y2="145" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <rect x="720" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" />
  <text x="820.0" y="138" font-size="20" fill="#e2e8f0" text-anchor="middle">NaN goes into</text>
  <text x="820.0" y="166" font-size="20" fill="#e2e8f0" text-anchor="middle">the total</text>
  <line x1="924" y1="145" x2="946" y2="145" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <rect x="952" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="3" />
  <text x="1052.0" y="138" font-size="20" fill="#e2e8f0" text-anchor="middle">The page says</text>
  <text x="1052.0" y="166" font-size="20" fill="#e2e8f0" text-anchor="middle">&#8220;Total: NaN&#8221;</text>
  <text x="124" y="64" font-size="22" fill="#fca5a5" text-anchor="middle" font-weight="bold">the mistake</text>
  <text x="1052" y="64" font-size="22" fill="#fca5a5" text-anchor="middle" font-weight="bold">where we see it</text>
  <text x="590" y="250" font-size="22" fill="#7dd3fc" text-anchor="middle">no errors anywhere along the way</text>

</svg>
