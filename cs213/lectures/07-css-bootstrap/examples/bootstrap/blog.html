<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colan's Coffee Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="#">Colan's Coffee Blog</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#links"
          aria-controls="links"
          aria-expanded="false"
          aria-label="Show the links"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="links">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Visited</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Wishlist</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4">
      <div class="row g-4">
        <article class="col-md-9">
          <h2>Visited</h2>
          <p>Here is some text about the purpose of my made-up blog.</p>
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Shop</th>
                <th>Drink</th>
                <th class="text-end">Rating</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Recreo</td>
                <td>Cortado</td>
                <td class="text-end">5</td>
              </tr>
              <tr>
                <td>Nero</td>
                <td>Latte</td>
                <td class="text-end">3</td>
              </tr>
              <tr>
                <td>Starbucks</td>
                <td>Drip</td>
                <td class="text-end">2</td>
              </tr>
            </tbody>
          </table>
          <button class="btn btn-primary">Add a review</button>
        </article>
        <aside class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h3 class="card-title h5">Ad</h3>
              <p class="card-text">Beans by the pound, roasted this week.</p>
              <a href="#" class="btn btn-outline-secondary btn-sm">Shop</a>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <footer class="container border-top py-3 text-body-secondary">
      Copyright 2026
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
