<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twelve Columns</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      /* Our colors, so the columns are visible. Bootstrap does not ship these. */
      .box {
        background-color: rgb(230, 201, 168);
        border: 2px solid rgb(138, 75, 31);
        padding: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-1 box">1</div>
        <div class="col-1 box">2</div>
        <div class="col-1 box">3</div>
        <div class="col-1 box">4</div>
        <div class="col-1 box">5</div>
        <div class="col-1 box">6</div>
        <div class="col-1 box">7</div>
        <div class="col-1 box">8</div>
        <div class="col-1 box">9</div>
        <div class="col-1 box">10</div>
        <div class="col-1 box">11</div>
        <div class="col-1 box">12</div>
      </div>
      <div class="row">
        <div class="col-4 box">col-4</div>
        <div class="col-4 box">col-4</div>
        <div class="col-4 box">col-4</div>
      </div>
      <div class="row">
        <div class="col-4 box">col-4</div>
        <div class="col-8 box">col-8</div>
      </div>
      <div class="row">
        <div class="col-6 box">col-6</div>
        <div class="col-6 box">col-6</div>
      </div>
      <div class="row">
        <div class="col-12 box">col-12</div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
