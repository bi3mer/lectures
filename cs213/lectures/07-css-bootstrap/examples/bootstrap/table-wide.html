<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Wide Table</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Shop</th>
              <th>Drink</th>
              <th>Rating</th>
              <th>Price</th>
              <th>Neighborhood</th>
              <th>Last Visit</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Recreo</td>
              <td>Cortado</td>
              <td>5</td>
              <td>$4.50</td>
              <td>Fishtown</td>
              <td>2026-09-12</td>
            </tr>
            <tr>
              <td>Nero</td>
              <td>Latte</td>
              <td>3</td>
              <td>$5.25</td>
              <td>Center City</td>
              <td>2026-08-30</td>
            </tr>
            <tr>
              <td>Starbucks</td>
              <td>Drip</td>
              <td>2</td>
              <td>$3.10</td>
              <td>University City</td>
              <td>2026-09-20</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p>Ratings are out of five.</p>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
