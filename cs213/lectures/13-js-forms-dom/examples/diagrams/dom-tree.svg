<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The DOM is a tree</title>
  <desc>The body element was the root of this tree. Its children were the h1 element, a comment node holding "the text", and the p element. The h1's one child was the text node "Shutterbug". The p's children were the text node "Golden " and the b element. The b's one child was the text node "hour". Elements were blue, text nodes yellow, and the comment gray.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="640" height="452" rx="18" fill="#0f1b2d" />
  <rect width="640" height="452" rx="18" fill="url(#grid)" />

  <!-- Node types have one color each: elements blue, text yellow, comments gray. -->

  <!-- Lines from each parent's bottom edge to each child's top edge -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M320 62 L110 132" />
    <path d="M320 62 L320 132" />
    <path d="M320 62 L500 132" />
    <path d="M110 172 L110 232" />
    <path d="M500 172 L415 232" />
    <path d="M500 172 L565 232" />
    <path d="M565 272 L565 332" />
  </g>

  <!-- Elements -->
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="2.5">
    <rect x="270" y="22" width="100" height="40" rx="8" />
    <rect x="70" y="132" width="80" height="40" rx="8" />
    <rect x="460" y="132" width="80" height="40" rx="8" />
    <rect x="530" y="232" width="70" height="40" rx="8" />
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    <text x="320" y="49">&lt;body&gt;</text>
    <text x="110" y="159">&lt;h1&gt;</text>
    <text x="500" y="159">&lt;p&gt;</text>
    <text x="565" y="259">&lt;b&gt;</text>
  </g>

  <!-- Text nodes -->
  <g fill="#1e293b" stroke="#facc15" stroke-width="2.5">
    <rect x="30" y="232" width="160" height="40" rx="20" />
    <rect x="355" y="232" width="120" height="40" rx="20" />
    <rect x="505" y="332" width="120" height="40" rx="20" />
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#facc15" text-anchor="middle" style="white-space: pre">
    <text x="110" y="259">"Shutterbug"</text>
    <text x="415" y="259">"Golden "</text>
    <text x="565" y="359">"hour"</text>
  </g>

  <!-- The comment node -->
  <rect x="208" y="132" width="224" height="40" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="320" y="158" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#94a3b8" text-anchor="middle">&lt;!-- the text --&gt;</text>

  <!-- Key -->
  <g font-size="18" fill="#e2e8f0">
    <rect x="40" y="404" width="22" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="72" y="421">element</text>
    <rect x="190" y="404" width="22" height="22" rx="11" fill="#1e293b" stroke="#facc15" stroke-width="2.5" />
    <text x="222" y="421">text</text>
    <rect x="310" y="404" width="22" height="22" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 3" />
    <text x="342" y="421">comment</text>
  </g>
</svg>
