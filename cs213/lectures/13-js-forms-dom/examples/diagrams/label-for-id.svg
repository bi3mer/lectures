<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A label's for matches its control's id</title>
  <desc>An input tag with the id "subscribe" sat above a label tag whose for was "subscribe". An arrow ran from the label's for value up to the matching id value. On the page, a pointer clicked the words Subscribe, and an arrow ran from the words to the checkbox, which was ticked.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
    <marker id="arrow-match" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#facc15" />
    </marker>
    <marker id="arrow-click" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1040" height="234" rx="18" fill="#0f1b2d" />
  <rect width="1040" height="234" rx="18" fill="url(#grid)" />

  <!-- Column labels -->
  <g font-size="18" fill="#94a3b8">
    <text x="30" y="36">HTML</text>
    <text x="800" y="36">Page: click the words</text>
  </g>

  <!-- Cards: the input, then its label -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="30" y="52" width="674" height="52" rx="10" />
    <rect x="30" y="152" width="674" height="52" rx="10" />
  </g>

  <!-- id and for are blue, and their values yellow. textLength holds every character to
       14.4px, so the boxes below line up with the values in any monospace font. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#e2e8f0" style="font-variant-ligatures: none; white-space: pre">
    <text x="50" y="86" textLength="604.8">&lt;input <tspan fill="#38bdf8" font-weight="bold">id</tspan>=<tspan fill="#facc15">"subscribe"</tspan> type="checkbox" /&gt;</text>
    <text x="50" y="186" textLength="633.6">&lt;label <tspan fill="#38bdf8" font-weight="bold">for</tspan>=<tspan fill="#facc15">"subscribe"</tspan>&gt;Subscribe&lt;/label&gt;</text>
  </g>

  <!-- A box around each value: characters 10 to 22 of the input line, 11 to 23 of the label's -->
  <g fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-width="2">
    <rect x="190" y="63" width="195" height="30" rx="6" />
    <rect x="204" y="163" width="196" height="30" rx="6" />
  </g>

  <!-- The label's for points at the input's id -->
  <path d="M296 161 V97" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow-match)" />
  <text x="310" y="134" font-size="18" fill="#facc15">matches</text>

  <!-- The page: a white panel, like a .demo on the slides -->
  <rect x="800" y="52" width="210" height="152" rx="12" fill="#ffffff" />

  <!-- The checkbox, ticked, and its label's words -->
  <rect x="826" y="130" width="24" height="24" rx="4" fill="#0075ff" />
  <path d="M832 142 L837 147 L845 136" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="862" y="150" font-size="22" fill="#111111">Subscribe</text>

  <!-- Clicking the words ticks the box -->
  <path d="M912 122 Q876 72 840 124" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-click)" />
  <path transform="translate(928 140)" d="M0 0 V22 L6 17 L10 26 L14 24 L10 15 H18 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />
</svg>
