<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The type attribute</title>
  <desc>Four input tags were the same except for their type attribute, which was "text", "range", "checkbox", and "color". Each one pointed to the control it made on the page: a text box, a slider, a ticked checkbox, and an orange color swatch.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="816" height="352" rx="18" fill="#0f1b2d" />
  <rect width="816" height="352" rx="18" fill="url(#grid)" />

  <!-- Rows are centered at y = 78, 152, 226, and 300: the HTML on the left, the control it
       makes on the right. -->

  <!-- Column labels -->
  <g font-size="18" fill="#94a3b8">
    <text x="30" y="36">HTML</text>
    <text x="536" y="36">Page</text>
  </g>

  <!-- Cards: one input tag each -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="30" y="52" width="400" height="52" rx="10" />
    <rect x="30" y="126" width="400" height="52" rx="10" />
    <rect x="30" y="200" width="400" height="52" rx="10" />
    <rect x="30" y="274" width="400" height="52" rx="10" />
  </g>

  <!-- Only the type changes: type is blue, and its value yellow. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#e2e8f0" style="font-variant-ligatures: none; white-space: pre">
    <text x="50" y="86">&lt;input <tspan fill="#38bdf8" font-weight="bold">type</tspan>=<tspan fill="#facc15">"text"</tspan> /&gt;</text>
    <text x="50" y="160">&lt;input <tspan fill="#38bdf8" font-weight="bold">type</tspan>=<tspan fill="#facc15">"range"</tspan> /&gt;</text>
    <text x="50" y="234">&lt;input <tspan fill="#38bdf8" font-weight="bold">type</tspan>=<tspan fill="#facc15">"checkbox"</tspan> /&gt;</text>
    <text x="50" y="308">&lt;input <tspan fill="#38bdf8" font-weight="bold">type</tspan>=<tspan fill="#facc15">"color"</tspan> /&gt;</text>
  </g>

  <!-- Arrows from each tag to its control -->
  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M446 78 H520" />
    <path d="M446 152 H520" />
    <path d="M446 226 H520" />
    <path d="M446 300 H520" />
  </g>

  <!-- The page: a white panel, like a .demo on the slides -->
  <rect x="536" y="48" width="250" height="282" rx="12" fill="#ffffff" />

  <!-- text: an empty box with a caret -->
  <rect x="566" y="62" width="200" height="32" rx="4" fill="#ffffff" stroke="#767676" stroke-width="1.5" />
  <path d="M576 69 V87" stroke="#111111" stroke-width="1.5" />

  <!-- range: a track, blue up to the thumb -->
  <rect x="566" y="148" width="200" height="8" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <rect x="566" y="148" width="100" height="8" rx="4" fill="#0075ff" />
  <circle cx="666" cy="152" r="10" fill="#0075ff" />

  <!-- checkbox: ticked -->
  <rect x="566" y="214" width="24" height="24" rx="4" fill="#0075ff" />
  <path d="M572 226 L577 231 L585 220" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- color: a swatch inside a button -->
  <rect x="566" y="284" width="60" height="32" rx="4" fill="#efefef" stroke="#767676" stroke-width="1.5" />
  <rect x="572" y="290" width="48" height="20" fill="#f99d1b" stroke="#777777" stroke-width="1" />
</svg>
