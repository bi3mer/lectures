<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One loop, two ways</title>
  <desc>The same loop written two ways. With while, the setup let count = 1; came before the loop, the condition count &lt;= 5 sat in the parentheses after while, and the update count++ was the last line of the block. With for, the setup, the condition, and the update sat together on one line, separated by semicolons: for (let count = 1; count &lt;= 5; count++). Both blocks printed count.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1120" height="300" rx="18" fill="#0f1b2d" />
  <rect width="1120" height="300" rx="18" fill="url(#grid)" />

  <!-- Card labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc" style="font-variant-ligatures: none">
    <text x="24" y="36">with while</text>
    <text x="428" y="36">the same loop with for</text>
  </g>

  <!-- Cards: the while loop on the left, the for loop on the right -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="24" y="52" width="380" height="232" rx="10" />
    <rect x="428" y="52" width="668" height="232" rx="10" />
  </g>

  <!-- The setup is blue, the condition is green, and the update is yellow, in both cards. -->

  <!-- The while loop. The indented lines start two characters in. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#e2e8f0" style="font-variant-ligatures: none; white-space: pre">
    <text x="48" y="100"><tspan fill="#38bdf8" font-weight="bold">let count = 1</tspan>;</text>
    <text x="48" y="136">while (<tspan fill="#4ade80" font-weight="bold">count &lt;= 5</tspan>) {</text>
    <text x="76.8" y="172">console.log(count);</text>
    <text x="76.8" y="208"><tspan fill="#facc15" font-weight="bold">count++</tspan>;</text>
    <text x="48" y="244">}</text>
  </g>

  <!-- The for loop's first line. Each part is its own text, 14.4px per character, so the
       names above line up with it in any monospace font. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#e2e8f0" style="font-variant-ligatures: none; white-space: pre">
    <text x="452" y="136">for (</text>
    <text x="524" y="136" fill="#38bdf8" font-weight="bold">let count = 1</text>
    <text x="711.2" y="136">;</text>
    <text x="740" y="136" fill="#4ade80" font-weight="bold">count &lt;= 5</text>
    <text x="884" y="136">;</text>
    <text x="912.8" y="136" fill="#facc15" font-weight="bold">count++</text>
    <text x="1013.6" y="136">) {</text>
    <text x="480.8" y="172">console.log(count);</text>
    <text x="452" y="208">}</text>
  </g>

  <!-- The name of each part, above it -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
    <text x="617.6" y="100" fill="#38bdf8">setup</text>
    <text x="812" y="100" fill="#4ade80">condition</text>
    <text x="963.2" y="100" fill="#facc15">update</text>
  </g>
</svg>
