<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An else if chain</title>
  <desc>score held 75. Step 1 checked score &lt; 60. 75 &lt; 60 was false, so JavaScript skipped the block that stored "F". Step 2 checked score &lt; 80. 75 &lt; 80 was true, so JavaScript ran the block that stored "C". Step 3 skipped the else block, since a check above it was true. grade held "C".</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="386" rx="18" fill="#0f1b2d" />
  <rect width="540" height="386" rx="18" fill="url(#grid)" />

  <!-- Dashed outlines: the blocks JavaScript skipped -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6">
    <rect x="24" y="48" width="492" height="44" rx="10" />
    <rect x="24" y="232" width="492" height="44" rx="10" />
  </g>

  <!-- Solid card with a blue edge: the block that ran -->
  <rect x="24" y="140" width="492" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />

  <!-- Each block's check, and the value it would store in size -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" style="font-variant-ligatures: none; white-space: pre">
    <text x="40" y="76" fill="#94a3b8">if (score &lt; 60)</text>
    <text x="500" y="76" fill="#94a3b8" text-anchor="end">"F"</text>
    <text x="40" y="168" fill="#e2e8f0">else if (score &lt; 80)</text>
    <text x="500" y="168" fill="#facc15" text-anchor="end">"C"</text>
    <text x="40" y="260" fill="#94a3b8">else</text>
    <text x="500" y="260" fill="#94a3b8" text-anchor="end">"A"</text>
  </g>

  <!-- What size held after the chain -->
  <rect x="24" y="300" width="492" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="40" y="343" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0" style="white-space: pre">size held <tspan fill="#facc15">"C"</tspan></text>

  <!-- Step numbers, in the order JavaScript checked -->
  <g fill="#38bdf8">
    <circle cx="36" cy="26" r="15" />
    <circle cx="36" cy="118" r="15" />
    <circle cx="36" cy="210" r="15" />
  </g>
  <g font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
    <text x="36" y="33">1</text>
    <text x="36" y="125">2</text>
    <text x="36" y="217">3</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc" style="font-variant-ligatures: none">
    <text x="62" y="33">75 &lt; 60 was false</text>
    <text x="62" y="125">75 &lt; 80 was true, so it ran</text>
    <text x="62" y="217">skipped, a check above was true</text>
  </g>
</svg>
