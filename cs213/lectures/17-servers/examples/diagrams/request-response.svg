<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A request and a response</title>
  <desc>The browser sends a request, asking for the cats page. The server sends back a response, the cats page.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="300" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="300" rx="18" fill="url(#grid)" />
  <text x="160" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Client</text>
  <text x="1030" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Server</text>
  <rect x="40" y="66" width="240" height="160" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
  <path d="M40 102 v-24 a12 12 0 0 1 12 -12 h216 a12 12 0 0 1 12 12 v24 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
  <circle cx="60" cy="84" r="6" fill="#ff5f57" />
  <circle cx="78" cy="84" r="6" fill="#febc2e" />
  <circle cx="96" cy="84" r="6" fill="#28c840" />
  <rect x="114" y="74" width="150" height="20" rx="10" fill="#fff" />
  <rect x="64" y="126" width="180" height="12" rx="6" fill="#cbd5e1" />
  <rect x="64" y="148" width="153" height="12" rx="6" fill="#cbd5e1" />
  <rect x="64" y="170" width="117" height="12" rx="6" fill="#cbd5e1" />
  <rect x="950" y="70" width="160" height="46" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="970" cy="93" r="6" fill="#22c55e" /><circle cx="990" cy="93" r="6" fill="#38bdf8" />
  <rect x="1014" y="89" width="76" height="8" rx="4" fill="#1e293b" />
  <rect x="950" y="124" width="160" height="46" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="970" cy="147" r="6" fill="#22c55e" /><circle cx="990" cy="147" r="6" fill="#38bdf8" />
  <rect x="1014" y="143" width="76" height="8" rx="4" fill="#1e293b" />
  <rect x="950" y="178" width="160" height="46" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
  <circle cx="970" cy="201" r="6" fill="#22c55e" /><circle cx="990" cy="201" r="6" fill="#38bdf8" />
  <rect x="1014" y="197" width="76" height="8" rx="4" fill="#1e293b" />
  <line x1="304" y1="120" x2="930" y2="120" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <text x="617" y="102" font-size="22" fill="#7dd3fc" text-anchor="middle">1. Request: &#8220;May I have the cats page?&#8221;</text>
  <line x1="930" y1="200" x2="304" y2="200" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <text x="617" y="182" font-size="22" fill="#7dd3fc" text-anchor="middle">2. Response: &#8220;Here it is.&#8221;</text>
  <text x="160" y="270" font-size="20" fill="#e2e8f0" text-anchor="middle">our browser</text>
  <text x="1030" y="270" font-size="20" fill="#e2e8f0" text-anchor="middle">a computer somewhere else</text>

</svg>
