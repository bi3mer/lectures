<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pie Chart</title>
    <style>
      /* The lecture slides' colors: combination 151 from Sanzo Wada's "A Dictionary of Color
         Combinations, Vol. 1", with shades of its blue for the cards and rules. */
      :root {
        --bg: #064f6e;
        --text: #f5ecc2;
        --accent: #f99d1b;
        --secondary: #a8c1cc;
        --rule: #38728b;
        --card: #032837;
        color-scheme: dark;
      }

      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        accent-color: var(--accent);
      }

      header {
        text-align: center;
      }

      h1 {
        margin-bottom: 0;
        font-size: 44px;
      }

      header p {
        margin-top: 4px;
        color: var(--secondary);
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }

      .card {
        margin-bottom: 16px;
        padding: 0 16px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background-color: var(--card);
      }

      /* Like a slide's heading: a rule underneath, with a short accent bar at its left end */
      h2 {
        position: relative;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }

      h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2.5px;
        width: 2.5em;
        height: 4px;
        border-radius: 2px;
        background-color: var(--accent);
      }

      fieldset {
        border: 1px solid var(--rule);
        border-radius: 8px;
      }

      legend {
        color: var(--secondary);
      }

      /* Rows of controls. A div has no margin of its own, so this spaces them out. */
      .card > div,
      .card > fieldset {
        margin: 16px 0;
      }

      #topping-boxes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      input,
      select,
      button {
        font: inherit;
      }

      button {
        padding: 4px 16px;
        border: none;
        border-radius: 6px;
        background-color: var(--accent);
        color: var(--card);
        font-weight: bold;
        cursor: pointer;
      }

      /* Room for the large pizza, so the order list stays put when the size changes */
      #board {
        display: grid;
        place-items: center;
        height: 360px;
      }

      /* The pizza is a circle: its border is the crust, and its background is the sauce. */
      #pizza {
        position: relative;
        box-sizing: border-box;
        width: 288px;
        aspect-ratio: 1;
        border: 14px solid #e3ad62;
        border-radius: 50%;
        background-color: #c8371d;
        transition:
          width 0.3s,
          border-width 0.3s;
      }

      #pizza.thin {
        border-width: 6px;
      }

      #pizza.regular {
        border-width: 14px;
      }

      #pizza.deep {
        border-width: 26px;
      }

      #cheese {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        background-color: #f3cf6b;
        transition: inset 0.3s;
      }

      #pizza.extra-cheese #cheese {
        inset: 2%;
        background-color: #ffe39a;
      }

      #toppings {
        position: absolute;
        inset: 0;
      }

      /* Each piece is centered on the spot its left and top give. */
      .piece {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 24px;
        line-height: 1;
      }

      #order {
        padding-left: 20px;
      }

      .total {
        font-size: 20px;
        font-weight: bold;
      }

      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pie Chart</h1>
      <p>Build your own pizza</p>
    </header>

    <main>
      <!-- autocomplete="off" keeps a reload from bringing back the last picks -->
      <form id="build" class="card" autocomplete="off">
        <h2>Build</h2>

        <!-- Size -->
        <fieldset>
          <legend>Size</legend>
          <input id="small" name="size" type="radio" value="small" onchange="showSize()" />
          <label for="small">Small</label>
          <input
            id="medium"
            name="size"
            type="radio"
            value="medium"
            onchange="showSize()"
            checked
          />
          <label for="medium">Medium</label>
          <input id="large" name="size" type="radio" value="large" onchange="showSize()" />
          <label for="large">Large</label>
        </fieldset>

        <!-- Crust -->
        <div>
          <label for="crust">Crust</label>
          <select id="crust" name="crust" onchange="showCrust()">
            <option value="thin">Thin</option>
            <option value="regular" selected>Regular</option>
            <option value="deep">Deep dish</option>
          </select>
        </div>

        <!-- Sauce -->
        <fieldset>
          <legend>Sauce</legend>
          <input
            id="tomato"
            name="sauce"
            type="radio"
            value="tomato"
            onchange="showSauce()"
            checked
          />
          <label for="tomato">Tomato</label>
          <input id="white" name="sauce" type="radio" value="white" onchange="showSauce()" />
          <label for="white">White</label>
          <input id="pesto" name="sauce" type="radio" value="pesto" onchange="showSauce()" />
          <label for="pesto">Pesto</label>
          <input id="bbq" name="sauce" type="radio" value="bbq" onchange="showSauce()" />
          <label for="bbq">BBQ</label>
        </fieldset>

        <!-- Extra Cheese -->
        <div>
          <input id="extra-cheese" name="extra-cheese" type="checkbox" onchange="showCheese()" />
          <label for="extra-cheese">Extra cheese</label>
        </div>

        <!-- Toppings -->
        <fieldset id="topping-boxes">
          <legend>Toppings</legend>
          <div>
            <input
              id="mushroom"
              name="topping"
              type="checkbox"
              value="mushroom"
              onchange="showTopping('mushroom')"
            />
            <label for="mushroom">🍄 Mushrooms</label>
          </div>
          <div>
            <input
              id="onion"
              name="topping"
              type="checkbox"
              value="onion"
              onchange="showTopping('onion')"
            />
            <label for="onion">🧅 Onions</label>
          </div>
          <div>
            <input
              id="jalapeno"
              name="topping"
              type="checkbox"
              value="jalapeno"
              onchange="showTopping('jalapeno')"
            />
            <label for="jalapeno">🌶️ Jalapeños</label>
          </div>
          <div>
            <input
              id="pineapple"
              name="topping"
              type="checkbox"
              value="pineapple"
              onchange="showTopping('pineapple')"
            />
            <label for="pineapple">🍍 Pineapple</label>
          </div>
          <div>
            <input
              id="bacon"
              name="topping"
              type="checkbox"
              value="bacon"
              onchange="showTopping('bacon')"
            />
            <label for="bacon">🥓 Bacon</label>
          </div>
          <div>
            <input
              id="basil"
              name="topping"
              type="checkbox"
              value="basil"
              onchange="showTopping('basil')"
            />
            <label for="basil">🌿 Basil</label>
          </div>
        </fieldset>

        <!-- Buttons -->
        <div>
          <button type="button" onclick="parsons1()">Clear toppings</button>
          <button type="button" onclick="placeOrder()">Place order</button>
        </div>
      </form>

      <section class="card">
        <h2>Your Pizza</h2>
        <div id="board">
          <div id="pizza" class="regular">
            <!-- layers, from the bottom up, on top of the sauce -->
            <div id="cheese"></div>
            <div id="toppings"></div>
          </div>
        </div>
        <ul id="order"></ul>
        <p class="total">Total: <span id="total"></span></p>
      </section>
    </main>

    <script src="practice.js"></script>
  </body>
</html>
