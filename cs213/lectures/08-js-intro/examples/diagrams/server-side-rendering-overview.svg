<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Server-side rendering, the general idea</title>
  <desc>The browser asked the server for a page. The server built the HTML. The server sent back a whole new page, and the browser showed it.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="320" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="320" rx="18" fill="url(#grid)" />

  <g transform="translate(30 20)">
    <!-- Labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
      <text x="180" y="30">The user&#8217;s browser</text>
      <text x="940" y="30">The server</text>
    </g>

    <!-- The browser, showing a page -->
    <g>
      <rect x="20" y="50" width="320" height="220" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
      <path d="M20 86 V62 a12 12 0 0 1 12 -12 H328 a12 12 0 0 1 12 12 V86 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
      <circle cx="40" cy="68" r="6" fill="#ff5f57" />
      <circle cx="58" cy="68" r="6" fill="#febc2e" />
      <circle cx="76" cy="68" r="6" fill="#28c840" />
      <rect x="94" y="58" width="230" height="20" rx="10" fill="#fff" />

      <rect x="44" y="106" width="160" height="18" rx="4" fill="#475569" />
      <g fill="#cbd5e1">
        <rect x="44" y="142" width="272" height="12" rx="6" />
        <rect x="44" y="166" width="250" height="12" rx="6" />
        <rect x="44" y="190" width="204" height="12" rx="6" />
      </g>
      <rect x="44" y="222" width="90" height="28" rx="6" fill="#2563eb" />
    </g>

    <!-- Top arrow: the browser asks for a page -->
    <line x1="360" y1="120" x2="826" y2="120" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <circle cx="500" cy="94" r="15" fill="#38bdf8" />
    <text x="500" y="101" font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">1</text>
    <text x="525" y="101" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">asked for a page</text>

    <!-- The server, a rack of three units with status lights -->
    <g>
      <g fill="#334155" stroke="#64748b" stroke-width="2">
        <rect x="850" y="70" width="180" height="56" rx="8" />
        <rect x="850" y="136" width="180" height="56" rx="8" />
        <rect x="850" y="202" width="180" height="56" rx="8" />
      </g>
      <g fill="#22c55e">
        <circle cx="874" cy="98" r="6" />
        <circle cx="874" cy="164" r="6" />
        <circle cx="874" cy="230" r="6" />
      </g>
      <g fill="#38bdf8">
        <circle cx="894" cy="98" r="6" />
        <circle cx="894" cy="164" r="6" />
        <circle cx="894" cy="230" r="6" />
      </g>
      <g fill="#1e293b">
        <rect x="928" y="94" width="82" height="8" rx="4" />
        <rect x="928" y="160" width="82" height="8" rx="4" />
        <rect x="928" y="226" width="82" height="8" rx="4" />
      </g>
    </g>

    <!-- Beside the server, between the arrows: it built the HTML -->
    <circle cx="635" cy="170" r="15" fill="#38bdf8" />
    <text x="635" y="177" font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">2</text>
    <text x="828" y="177" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc" text-anchor="end">built the HTML</text>

    <!-- Bottom arrow: a whole new page comes back -->
    <line x1="830" y1="220" x2="364" y2="220" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <g>
      <path d="M577 197 H603 L613 207 V243 H577 Z" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
      <path d="M603 197 V207 H613" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
      <g fill="#cbd5e1">
        <rect x="583" y="214" width="24" height="4" rx="2" />
        <rect x="583" y="222" width="24" height="4" rx="2" />
        <rect x="583" y="230" width="16" height="4" rx="2" />
      </g>
    </g>
    <circle cx="428" cy="262" r="15" fill="#38bdf8" />
    <text x="428" y="269" font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">3</text>
    <text x="453" y="269" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">sent back a whole new page</text>
  </g>
</svg>
