<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Server-side rendering</title>
  <desc>The user clicked "Log in" with the password box empty, and the browser sent the form to the server. The server saw the empty password and built new HTML. The browser loaded the whole new page, which said "Login failed, please enter a password".</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="450" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="450" rx="18" fill="url(#grid)" />

  <g transform="translate(30 20)">
    <!-- Column labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
      <text x="160" y="30">The user&#8217;s browser</text>
      <text x="560" y="30">The server</text>
      <text x="960" y="30">The user&#8217;s browser</text>
    </g>

    <!-- Step 1: the login form, password left empty, cursor on "Log in" -->
    <g>
      <rect x="2" y="50" width="316" height="240" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
      <path d="M2 86 V62 a12 12 0 0 1 12 -12 H306 a12 12 0 0 1 12 12 V86 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
      <circle cx="22" cy="68" r="6" fill="#ff5f57" />
      <circle cx="40" cy="68" r="6" fill="#febc2e" />
      <circle cx="58" cy="68" r="6" fill="#28c840" />
      <rect x="76" y="58" width="226" height="20" rx="10" fill="#fff" />

      <text x="24" y="118" font-size="22" font-weight="bold" fill="#0f172a">Log in</text>
      <text x="24" y="195" font-size="17" fill="#475569">Username</text>
      <rect x="120" y="176" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="130" y="195" font-size="17" fill="#0f172a">colan</text>
      <text x="24" y="233" font-size="17" fill="#475569">Password</text>
      <rect x="120" y="214" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <rect x="24" y="252" width="96" height="30" rx="6" fill="#2563eb" />
      <text x="72" y="273" font-size="17" fill="#fff" text-anchor="middle">Log in</text>
      <path d="M100 262 V284 L105 279 L109 288 L113 286 L109 277 L116 277 Z" fill="#fff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Arrow: the form goes to the server -->
    <line x1="334" y1="170" x2="452" y2="170" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <text x="393" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc" text-anchor="middle">the form</text>

    <!-- Step 2: the server, a rack of three units with status lights -->
    <g>
      <g fill="#334155" stroke="#64748b" stroke-width="2">
        <rect x="470" y="80" width="180" height="56" rx="8" />
        <rect x="470" y="146" width="180" height="56" rx="8" />
        <rect x="470" y="212" width="180" height="56" rx="8" />
      </g>
      <g fill="#22c55e">
        <circle cx="494" cy="108" r="6" />
        <circle cx="494" cy="174" r="6" />
        <circle cx="494" cy="240" r="6" />
      </g>
      <g fill="#38bdf8">
        <circle cx="514" cy="108" r="6" />
        <circle cx="514" cy="174" r="6" />
        <circle cx="514" cy="240" r="6" />
      </g>
      <g fill="#1e293b">
        <rect x="548" y="104" width="82" height="8" rx="4" />
        <rect x="548" y="170" width="82" height="8" rx="4" />
        <rect x="548" y="236" width="82" height="8" rx="4" />
      </g>
    </g>

    <!-- Arrow: a whole new page comes back -->
    <line x1="668" y1="170" x2="786" y2="170" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <text x="727" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc" text-anchor="middle">new page</text>

    <!-- Step 3: the new page, with the error message -->
    <g transform="translate(800 0)">
      <rect x="2" y="50" width="316" height="240" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
      <path d="M2 86 V62 a12 12 0 0 1 12 -12 H306 a12 12 0 0 1 12 12 V86 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
      <circle cx="22" cy="68" r="6" fill="#ff5f57" />
      <circle cx="40" cy="68" r="6" fill="#febc2e" />
      <circle cx="58" cy="68" r="6" fill="#28c840" />
      <rect x="76" y="58" width="226" height="20" rx="10" fill="#fff" />

      <text x="24" y="118" font-size="22" font-weight="bold" fill="#0f172a">Log in</text>
      <text x="24" y="143" font-size="17" fill="#dc2626">Login failed, please</text>
      <text x="24" y="163" font-size="17" fill="#dc2626">enter a password</text>
      <text x="24" y="195" font-size="17" fill="#475569">Username</text>
      <rect x="120" y="176" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="130" y="195" font-size="17" fill="#0f172a">colan</text>
      <text x="24" y="233" font-size="17" fill="#475569">Password</text>
      <rect x="120" y="214" width="176" height="26" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <rect x="24" y="252" width="96" height="30" rx="6" fill="#2563eb" />
      <text x="72" y="273" font-size="17" fill="#fff" text-anchor="middle">Log in</text>
    </g>

    <!-- Step numbers and captions -->
    <g fill="#38bdf8">
      <circle cx="160" cy="320" r="17" />
      <circle cx="560" cy="320" r="17" />
      <circle cx="960" cy="320" r="17" />
    </g>
    <g font-size="20" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
      <text x="160" y="327">1</text>
      <text x="560" y="327">2</text>
      <text x="960" y="327">3</text>
    </g>
    <g font-size="20" fill="#e2e8f0" text-anchor="middle">
      <text x="160" y="366">The user clicked “Log in,”</text>
      <text x="160" y="392">and the browser sent the form.</text>
      <text x="560" y="366">The server saw the empty</text>
      <text x="560" y="392">password and built new HTML.</text>
      <text x="960" y="366">The browser loaded the</text>
      <text x="960" y="392">whole new page.</text>
    </g>
  </g>
</svg>
