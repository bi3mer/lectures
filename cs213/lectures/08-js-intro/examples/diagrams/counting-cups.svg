<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Counting cups</title>
  <desc>Step 1 stored 0 in a box named cupsSold. Step 2 added 1, so cupsSold held 1. Step 3 added 1, so cupsSold held 2. Step 4 added 10, so cupsSold held 12. Each new value replaced the old one. Step 5 printed 12 in the console.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="372" rx="18" fill="#0f1b2d" />
  <rect width="540" height="372" rx="18" fill="url(#grid)" />

  <!-- One cupsSold box holds every value it had, top to bottom. The console sits beside the last value. -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="30" y="56" width="140" height="284" rx="10" />
    <rect x="384" y="248" width="136" height="92" rx="10" />
  </g>
  <g fill="#334155" stroke="#64748b" stroke-width="2">
    <path d="M30 90 V66 a10 10 0 0 1 10 -10 H160 a10 10 0 0 1 10 10 V90 z" />
    <path d="M384 282 V258 a10 10 0 0 1 10 -10 H510 a10 10 0 0 1 10 10 V282 z" />
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#e2e8f0">
    <text x="100" y="80" text-anchor="middle">cupsSold</text>
    <text x="398" y="272">Console</text>
  </g>

  <!-- Values in cupsSold. Each new value replaced the old one, so 0, 1, and 2 are gray and crossed out. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="bold" text-anchor="middle">
    <text x="100" y="128" font-size="24" fill="#64748b">0</text>
    <text x="100" y="190" font-size="24" fill="#64748b">1</text>
    <text x="100" y="252" font-size="24" fill="#64748b">2</text>
    <text x="100" y="322" font-size="30" fill="#facc15">12</text>
  </g>
  <g stroke="#f87171" stroke-width="2.5">
    <line x1="86" y1="120" x2="114" y2="120" />
    <line x1="86" y1="182" x2="114" y2="182" />
    <line x1="86" y1="244" x2="114" y2="244" />
  </g>

  <!-- What the console showed -->
  <text x="400" y="322" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0">12</text>

  <!-- Arrows: each shortcut turns the old value into the new one, and the last value goes to the console -->
  <g stroke="#38bdf8" stroke-width="4" marker-end="url(#head)">
    <line x1="100" y1="138" x2="100" y2="164" />
    <line x1="100" y1="200" x2="100" y2="226" />
    <line x1="100" y1="262" x2="100" y2="290" />
    <line x1="180" y1="311" x2="372" y2="311" />
  </g>

  <!-- Step numbers, one per line of code -->
  <g fill="#38bdf8">
    <circle cx="44" cy="34" r="15" />
    <circle cx="198" cy="153" r="15" />
    <circle cx="198" cy="215" r="15" />
    <circle cx="198" cy="278" r="15" />
    <circle cx="198" cy="337" r="15" />
  </g>
  <g font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
    <text x="44" y="41">1</text>
    <text x="198" y="160">2</text>
    <text x="198" y="222">3</text>
    <text x="198" y="285">4</text>
    <text x="198" y="344">5</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">
    <text x="68" y="41">stored 0 in cupsSold</text>
    <text x="222" y="160">added 1</text>
    <text x="222" y="222">added 1</text>
    <text x="222" y="285">added 10</text>
    <text x="222" y="344">printed 12</text>
  </g>
</svg>
