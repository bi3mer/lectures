<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Getting the new value out</title>
  <desc>Step 1 stored 3 in a box named bags. In step 2, addFreeBag(bags) copied 3 into a box named count, inside addFreeBag. In step 3, count + 1 became 3 + 1, which is 4, and return gave back 4. JavaScript stored 4 in bags, and 4 replaced 3. Step 4 printed 4 in the console.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="396" rx="18" fill="#0f1b2d" />
  <rect width="540" height="396" rx="18" fill="url(#grid)" />

  <!-- Dashed outline: everything that happened inside addFreeBag -->
  <rect x="258" y="56" width="258" height="148" rx="14" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6" />
  <text x="274" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#94a3b8">inside addFreeBag</text>

  <!-- bags (outside) and count (inside) are boxes: name in the header, value in the body. The console runs along the bottom. -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="30" y="96" width="140" height="158" rx="10" />
    <rect x="278" y="96" width="100" height="92" rx="10" />
    <rect x="24" y="300" width="492" height="78" rx="10" />
  </g>
  <g fill="#334155" stroke="#64748b" stroke-width="2">
    <path d="M30 130 V106 a10 10 0 0 1 10 -10 H160 a10 10 0 0 1 10 10 V130 z" />
    <path d="M278 130 V106 a10 10 0 0 1 10 -10 H368 a10 10 0 0 1 10 10 V130 z" />
    <path d="M24 334 V310 a10 10 0 0 1 10 -10 H506 a10 10 0 0 1 10 10 V334 z" />
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="bold" text-anchor="middle">
    <text x="100" y="120" font-size="18" fill="#e2e8f0">bags</text>
    <text x="328" y="120" font-size="18" fill="#e2e8f0">count</text>
    <text x="100" y="166" font-size="24" fill="#64748b">3</text>
    <text x="100" y="233" font-size="30" fill="#facc15">4</text>
    <text x="328" y="171" font-size="30" fill="#facc15">3</text>
  </g>

  <!-- 4 replaced the 3 in bags, so the 3 is gray and crossed out -->
  <line x1="86" y1="158" x2="114" y2="158" stroke="#f87171" stroke-width="2.5" />

  <!-- What the console showed -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e2e8f0">
    <text x="40" y="324" font-size="18" font-weight="bold">Console</text>
    <text x="42" y="362" font-size="20">4</text>
  </g>

  <!-- Step 3 inside addFreeBag: count + 1 turned into 3 + 1, then 4 (values in yellow) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0" text-anchor="middle" style="font-variant-ligatures: none">
    <text x="447" y="128">count + 1</text>
    <text x="447" y="154"><tspan fill="#facc15">3</tspan> + 1</text>
    <text x="447" y="180" fill="#facc15">4</text>
  </g>

  <!-- Arrows: the copy goes into count, return carries 4 back out into bags, and bags goes to the console -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" marker-end="url(#head)">
    <line x1="178" y1="159" x2="266" y2="159" />
    <path d="M447 190 V222 H182" />
    <line x1="100" y1="262" x2="100" y2="288" />
  </g>

  <!-- Step numbers, in the order the code ran -->
  <g fill="#38bdf8">
    <circle cx="36" cy="32" r="15" />
    <circle cx="214" cy="108" r="15" />
    <circle cx="300" cy="248" r="15" />
    <circle cx="130" cy="276" r="15" />
  </g>
  <g font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
    <text x="36" y="39">1</text>
    <text x="214" y="115">2</text>
    <text x="300" y="255">3</text>
    <text x="130" y="283">4</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">
    <text x="62" y="39">stored 3 in bags</text>
    <text x="214" y="146" font-size="18" text-anchor="middle">copy</text>
    <text x="322" y="255">gave back 4</text>
    <text x="152" y="283">printed 4</text>
  </g>
</svg>
