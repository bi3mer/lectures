<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Changing a value with let</title>
  <desc>Step 1 stored 14.5 in a box named price. Step 2 printed 14.5 in the console. Step 3 stored 16 in price, and 16 replaced 14.5. Step 4 printed 16, so the console showed 14.5 and then 16.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="348" rx="18" fill="#0f1b2d" />
  <rect width="540" height="348" rx="18" fill="url(#grid)" />

  <!-- Top row: price and the console after lines 1 and 2. Bottom row: the same price and console after lines 3 and 4. -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="30" y="56" width="140" height="92" rx="10" />
    <rect x="384" y="56" width="136" height="92" rx="10" />
    <rect x="30" y="236" width="140" height="92" rx="10" />
    <rect x="384" y="236" width="136" height="92" rx="10" />
  </g>
  <g fill="#334155" stroke="#64748b" stroke-width="2">
    <path d="M30 90 V66 a10 10 0 0 1 10 -10 H160 a10 10 0 0 1 10 10 V90 z" />
    <path d="M384 90 V66 a10 10 0 0 1 10 -10 H510 a10 10 0 0 1 10 10 V90 z" />
    <path d="M30 270 V246 a10 10 0 0 1 10 -10 H160 a10 10 0 0 1 10 10 V270 z" />
    <path d="M384 270 V246 a10 10 0 0 1 10 -10 H510 a10 10 0 0 1 10 10 V270 z" />
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#e2e8f0">
    <text x="100" y="80" text-anchor="middle">price</text>
    <text x="398" y="80">Console</text>
    <text x="100" y="260" text-anchor="middle">price</text>
    <text x="398" y="260">Console</text>
  </g>

  <!-- Values in price (yellow). In the bottom box, 16 replaced 14.5, so 14.5 is crossed out. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="bold" text-anchor="middle">
    <text x="100" y="131" font-size="30" fill="#facc15">14.5</text>
    <text x="72" y="307" font-size="20" fill="#64748b">14.5</text>
    <text x="132" y="309" font-size="30" fill="#facc15">16</text>
  </g>
  <line x1="44" y1="300" x2="100" y2="300" stroke="#f87171" stroke-width="3" />

  <!-- What the console showed. In the bottom console, 14.5 is gray because it was already there. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22">
    <text x="400" y="127" fill="#e2e8f0">14.5</text>
    <text x="400" y="295" fill="#64748b">14.5</text>
    <text x="400" y="320" fill="#e2e8f0">16</text>
  </g>

  <!-- Arrows: each print goes to the console, and the new value goes into the same price box -->
  <line x1="180" y1="119" x2="372" y2="119" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <line x1="100" y1="158" x2="100" y2="224" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
  <line x1="180" y1="299" x2="372" y2="299" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />

  <!-- Step numbers, one per line of code -->
  <g fill="#38bdf8">
    <circle cx="44" cy="34" r="15" />
    <circle cx="198" cy="93" r="15" />
    <circle cx="134" cy="186" r="15" />
    <circle cx="198" cy="273" r="15" />
  </g>
  <g font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
    <text x="44" y="41">1</text>
    <text x="198" y="100">2</text>
    <text x="134" y="193">3</text>
    <text x="198" y="280">4</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">
    <text x="68" y="41">stored 14.5 in price</text>
    <text x="220" y="100">printed 14.5</text>
    <text x="158" y="193">stored 16 in price</text>
    <text x="220" y="280">printed 16</text>
  </g>
</svg>
