<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>JavaScript in the browser</title>
  <desc>The user clicked "Log in" with the password box empty, and the page's JavaScript ran. JavaScript saw the empty password box. JavaScript added "Login failed, please enter a password" to the same page, and the page did not reload. All three steps happened inside the user's browser.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="1180" height="450" rx="18" fill="#0f1b2d" />
  <rect width="1180" height="450" rx="18" fill="url(#grid)" />

  <g transform="translate(30 20)">
    <!-- One dashed frame around all three steps: everything happened in the browser -->
    <rect x="-16" y="0" width="1152" height="302" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8" />
    <text x="560" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Inside the user&#8217;s browser</text>

    <!-- Step 1: the login form, password left empty, cursor on "Log in" -->
    <g>
      <rect x="2" y="50" width="316" height="240" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
      <path d="M2 86 V62 a12 12 0 0 1 12 -12 H306 a12 12 0 0 1 12 12 V86 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
      <circle cx="22" cy="68" r="6" fill="#ff5f57" />
      <circle cx="40" cy="68" r="6" fill="#febc2e" />
      <circle cx="58" cy="68" r="6" fill="#28c840" />
      <rect x="76" y="58" width="226" height="20" rx="10" fill="#fff" />

      <text x="24" y="118" font-size="22" font-weight="bold" fill="#0f172a">Log in</text>
      <text x="24" y="195" font-size="17" fill="#475569">Username</text>
      <rect x="120" y="176" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="130" y="195" font-size="17" fill="#0f172a">colan</text>
      <text x="24" y="233" font-size="17" fill="#475569">Password</text>
      <rect x="120" y="214" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <rect x="24" y="252" width="96" height="30" rx="6" fill="#2563eb" />
      <text x="72" y="273" font-size="17" fill="#fff" text-anchor="middle">Log in</text>
      <path d="M100 262 V284 L105 279 L109 288 L113 286 L109 277 L116 277 Z" fill="#fff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Arrow: the click goes to the page's JavaScript -->
    <line x1="334" y1="170" x2="436" y2="170" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <text x="385" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc" text-anchor="middle">the click</text>

    <!-- Step 2: the page's JavaScript, a code card with a yellow JS badge -->
    <g>
      <rect x="453" y="102" width="214" height="136" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <path d="M453 140 V112 a10 10 0 0 1 10 -10 H657 a10 10 0 0 1 10 10 V140 z" fill="#334155" stroke="#64748b" stroke-width="2" />
      <rect x="467" y="109" width="24" height="24" rx="4" fill="#facc15" />
      <text x="479" y="126" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">JS</text>
      <text x="501" y="127" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#e2e8f0">JavaScript</text>

      <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" style="font-variant-ligatures: none">
        <text x="467" y="172"><tspan fill="#38bdf8">if</tspan> (password === <tspan fill="#86efac">""</tspan>) {</text>
        <text x="484" y="196"><tspan fill="#facc15">showMessage</tspan>();</text>
        <text x="467" y="220">}</text>
      </g>
    </g>

    <!-- Arrow: JavaScript sends the message to the same page -->
    <line x1="682" y1="170" x2="784" y2="170" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)" />
    <text x="733" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc" text-anchor="middle">the message</text>

    <!-- Step 3: the same page, with the message added in red -->
    <g transform="translate(800 0)">
      <rect x="2" y="50" width="316" height="240" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3" />
      <path d="M2 86 V62 a12 12 0 0 1 12 -12 H306 a12 12 0 0 1 12 12 V86 z" fill="#dfe6ee" stroke="#94a3b8" stroke-width="3" />
      <circle cx="22" cy="68" r="6" fill="#ff5f57" />
      <circle cx="40" cy="68" r="6" fill="#febc2e" />
      <circle cx="58" cy="68" r="6" fill="#28c840" />
      <rect x="76" y="58" width="226" height="20" rx="10" fill="#fff" />

      <text x="24" y="118" font-size="22" font-weight="bold" fill="#0f172a">Log in</text>
      <text x="24" y="143" font-size="17" fill="#dc2626">Login failed, please</text>
      <text x="24" y="163" font-size="17" fill="#dc2626">enter a password</text>
      <text x="24" y="195" font-size="17" fill="#475569">Username</text>
      <rect x="120" y="176" width="176" height="26" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2" />
      <text x="130" y="195" font-size="17" fill="#0f172a">colan</text>
      <text x="24" y="233" font-size="17" fill="#475569">Password</text>
      <rect x="120" y="214" width="176" height="26" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2" />
      <rect x="24" y="252" width="96" height="30" rx="6" fill="#2563eb" />
      <text x="72" y="273" font-size="17" fill="#fff" text-anchor="middle">Log in</text>
    </g>

    <!-- Step numbers and captions -->
    <g fill="#38bdf8">
      <circle cx="160" cy="330" r="17" />
      <circle cx="560" cy="330" r="17" />
      <circle cx="960" cy="330" r="17" />
    </g>
    <g font-size="20" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
      <text x="160" y="337">1</text>
      <text x="560" y="337">2</text>
      <text x="960" y="337">3</text>
    </g>
    <g font-size="20" fill="#e2e8f0" text-anchor="middle">
      <text x="160" y="376">The user clicked “Log in,”</text>
      <text x="160" y="402">and the page’s JavaScript ran.</text>
      <text x="560" y="376">JavaScript saw the empty</text>
      <text x="560" y="402">password box.</text>
      <text x="960" y="376">JavaScript added the message.</text>
      <text x="960" y="402">The page did not reload.</text>
    </g>
  </g>
</svg>
