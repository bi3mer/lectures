<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The while cycle</title>
  <desc>A while loop went in a cycle. JavaScript started by checking the condition. When it was true, JavaScript ran the block, then went back and checked the condition again. When it was false, JavaScript skipped the block and moved on to the code after the loop.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="222" rx="18" fill="#0f1b2d" />
  <rect width="540" height="222" rx="18" fill="url(#grid)" />

  <!-- The check is green, like the condition in the for loop diagram. The block has a blue edge. -->
  <rect x="120" y="46" width="180" height="52" rx="26" fill="#1e293b" stroke="#4ade80" stroke-width="3" />
  <rect x="120" y="154" width="180" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <rect x="384" y="46" width="132" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />

  <text x="210" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="bold" fill="#4ade80" text-anchor="middle">condition</text>
  <text x="210" y="188" font-size="22" fill="#e2e8f0" text-anchor="middle">run the block</text>
  <g font-size="18" fill="#e2e8f0" text-anchor="middle">
    <text x="450" y="67">code after</text>
    <text x="450" y="89">the loop</text>
  </g>

  <!-- Arrows: in at the top, down to the block while true, back up to check again, out right when false -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#head)">
    <line x1="210" y1="8" x2="210" y2="34" />
    <line x1="250" y1="98" x2="250" y2="142" />
    <line x1="170" y1="154" x2="170" y2="110" />
    <line x1="300" y1="72" x2="372" y2="72" />
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc" style="font-variant-ligatures: none">
    <text x="198" y="30" text-anchor="end">start</text>
    <text x="262" y="133">true</text>
    <text x="158" y="133" text-anchor="end">check again</text>
    <text x="336" y="58" text-anchor="middle">false</text>
  </g>
</svg>
