<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 356" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Calling a function</title>
  <desc>Step 1 saved the function sayHello, but did not run the code inside it. In step 2, the first sayHello() call ran the code inside. In step 3, the second sayHello() call ran it again. Each run printed the greeting, so the console showed it twice.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c2e4a" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background: dark navy with a faint grid -->
  <rect width="540" height="356" rx="18" fill="#0f1b2d" />
  <rect width="540" height="356" rx="18" fill="url(#grid)" />

  <!-- Dashed outline: the code inside sayHello, saved until a call runs it -->
  <rect x="24" y="52" width="492" height="72" rx="14" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6" />
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" style="font-variant-ligatures: none">
    <text x="40" y="76" font-size="16" font-weight="bold" fill="#94a3b8">inside sayHello</text>
    <text x="40" y="108" font-size="15" fill="#e2e8f0">console.log("Hello, welcome to Web Development!");</text>
  </g>

  <!-- The two calls, and the console along the bottom -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="40" y="168" width="156" height="44" rx="10" />
    <rect x="220" y="168" width="156" height="44" rx="10" />
    <rect x="24" y="250" width="492" height="90" rx="10" />
  </g>
  <path d="M24 284 V260 a10 10 0 0 1 10 -10 H506 a10 10 0 0 1 10 10 V284 z" fill="#334155" stroke="#64748b" stroke-width="2" />
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e2e8f0" style="font-variant-ligatures: none">
    <text x="118" y="197" font-size="20" text-anchor="middle">sayHello();</text>
    <text x="298" y="197" font-size="20" text-anchor="middle">sayHello();</text>
    <text x="40" y="274" font-size="18" font-weight="bold">Console</text>
    <text x="42" y="309" font-size="18">Hello, welcome to Web Development!</text>
    <text x="42" y="332" font-size="18">Hello, welcome to Web Development!</text>
  </g>

  <!-- Arrows: each call runs the code inside, and each run prints to the console -->
  <g stroke="#38bdf8" stroke-width="4" marker-end="url(#head)">
    <line x1="118" y1="160" x2="118" y2="136" />
    <line x1="298" y1="160" x2="298" y2="136" />
    <line x1="470" y1="132" x2="470" y2="238" />
  </g>

  <!-- Step numbers, in the order the code ran -->
  <g fill="#38bdf8">
    <circle cx="36" cy="32" r="15" />
    <circle cx="148" cy="146" r="15" />
    <circle cx="328" cy="146" r="15" />
  </g>
  <g font-size="18" font-weight="bold" fill="#0f1b2d" text-anchor="middle">
    <text x="36" y="39">1</text>
    <text x="148" y="153">2</text>
    <text x="328" y="153">3</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">
    <text x="62" y="39">saved sayHello, did not run it</text>
    <text x="170" y="153">ran it</text>
    <text x="350" y="153">ran it</text>
    <text x="456" y="235" text-anchor="end">printed each time</text>
  </g>
</svg>
