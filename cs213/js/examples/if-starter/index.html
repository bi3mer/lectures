<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colan's Coffee</title>
    <style>
      body {
        max-width: 600px;
        margin: 0 auto;
        padding: 16px;
        font-family: sans-serif;
        background-color: white;
      }

      #sign {
        padding: 4px 12px;
        border-radius: 6px;
        background-color: dimgray;
        color: white;
        font-size: 16px;
        vertical-align: middle;
      }

      .card {
        margin-bottom: 16px;
        padding: 0 16px;
        border: 4px solid lightgray;
        border-radius: 8px;
        background-color: white;
      }

      button:disabled {
        opacity: 0.4;
      }

      #happy-price {
        color: green;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Colan's Coffee <span id="sign">Open</span></h1>
      <p id="greeting">Welcome!</p>
    </header>

    <section id="rewards" class="card">
      <h2><span id="badge">☕</span> <span id="member">Member</span></h2>
      <p>
        <label for="name">Your name:</label>
        <input id="name" oninput="showName()" />
      </p>
      <p>
        <label for="points">Your points:</label>
        <input id="points" type="number" value="320" oninput="showRewards()" />
      </p>
      <p id="pastry" hidden>🥐 Free pastry!</p>
    </section>

    <section class="card">
      <h2>Menu</h2>
      <p>
        <label for="age">Your age:</label>
        <input id="age" type="number" oninput="parsons1()" />
      </p>
      <p>Latte <span id="latte-price">$4.50</span> <span id="happy-price" hidden>$2.25</span> <button id="latte" onclick="parsons3()" disabled>Order</button></p>
      <p>Hot chocolate $3.75 <button>Order</button></p>
    </section>

    <section class="card">
      <h2>Beans</h2>
      <p>
        <img
          id="bag"
          src="https://bi3mer.github.io/lectures/cs213/js/exercises/bag.svg"
          alt="A bag of coffee beans"
          width="80"
        />
      </p>
      <p>House Blend, 12 oz, $14.50</p>
      <p id="stock">In stock.</p>
      <p><button id="buy" onclick="parsons4()">Buy</button></p>
    </section>

    <script src="practice.js"></script>
  </body>
</html>
