<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guild of the Curly Brace</title>
    <style>
      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
        font-family: sans-serif;
        background-color: #14231c;
        color: #efe8d8;
      }

      header {
        text-align: center;
      }

      h1 {
        margin-bottom: 0;
        font-size: 44px;
        color: #e0b354;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }

      .card {
        margin-bottom: 16px;
        padding: 0 16px;
        border: 2px solid #2f5040;
        border-radius: 8px;
        background-color: #1d3328;
      }

      fieldset {
        border: 2px solid #2f5040;
        border-radius: 8px;
      }

      .guild-card {
        margin-bottom: 16px;
        padding: 0 16px;
        border: 6px solid #e0b354;
        border-radius: 12px;
        background-color: #f4ecd8;
        color: #2b2118;
      }

      #card-name {
        font-size: 24px;
        font-weight: bold;
      }

      #card-motto {
        font-style: italic;
      }

      .bar {
        font-family: monospace;
        font-size: 18px;
      }

      input,
      select,
      button {
        font: inherit;
      }

      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Guild of the Curly Brace</h1>
      <p>New member registration</p>
    </header>

    <main>
      <form class="card">
        <h2>Your Hero</h2>

        <!-- Name and Motto -->

        <!-- Class Picker -->

        <!-- Banner Color -->

        <!-- Stats -->

        <!-- Hardcore -->

        <!-- Join Button -->
      </form>

      <div>
        <section class="card">
          <h2>Guild Card</h2>
          <div id="card" class="guild-card">
            <p id="card-name"></p>
            <p id="card-role"></p>
            <p id="card-motto"></p>
            <p class="bar">STR <span id="str-bar"></span></p>
            <p class="bar">DEX <span id="dex-bar"></span></p>
            <p class="bar">WIS <span id="wis-bar"></span></p>
            <p id="card-hardcore" hidden>☠ Hardcore</p>
          </div>
        </section>

        <section class="card">
          <h2 id="party-size">Party</h2>
          <ul id="party">
            <!-- the founders -->
            <li>Ada Nullbane the Mage</li>
            <li>Grace Loopfoot the Ranger</li>
            <li>Linus Stackwell the Warrior</li>
          </ul>
        </section>
      </div>
    </main>

    <script src="practice.js"></script>
  </body>
</html>
