<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plate Expectations</title>
    <style>
      /* The lecture slides' colors: combination 151 from Sanzo Wada's "A Dictionary of Color
         Combinations, Vol. 1", with shades of its blue for the cards and rules. */
      :root {
        --bg: #064f6e;
        --text: #f5ecc2;
        --accent: #f99d1b;
        --secondary: #a8c1cc;
        --rule: #38728b;
        --card: #032837;
        color-scheme: dark;
      }

      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        accent-color: var(--accent);
      }

      header {
        text-align: center;
      }

      h1 {
        margin-bottom: 0;
        font-size: 44px;
      }

      header p {
        margin-top: 4px;
        color: var(--secondary);
      }

      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
        align-items: start;
      }

      .card {
        margin-bottom: 16px;
        padding: 0 16px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background-color: var(--card);
      }

      /* Like a slide's heading: a rule underneath, with a short accent bar at its left end */
      h2 {
        position: relative;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }

      h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2.5px;
        width: 2.5em;
        height: 4px;
        border-radius: 2px;
        background-color: var(--accent);
      }

      /* Rows of controls. A div has no margin of its own, so this spaces them out. */
      .card > div {
        margin: 16px 0;
      }

      input,
      button {
        font: inherit;
      }

      /* A thick border, so a red or green one stands out */
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 4px 8px;
        border: 2px solid var(--rule);
        border-radius: 6px;
      }

      .error {
        margin: 4px 0 0;
        color: tomato;
        font-size: 14px;
      }

      button {
        padding: 4px 16px;
        border: none;
        border-radius: 6px;
        background-color: var(--accent);
        color: var(--card);
        font-weight: bold;
        cursor: pointer;
      }

      /* The plate: a white rectangle with a blue edge, the shop's name along the top, the plate
         text in the middle, and the tagline along the bottom */
      #plate-preview {
        position: relative;
        max-width: 480px;
        margin: 16px auto;
        padding: 12px 16px;
        border: 6px solid #1f3a68;
        border-radius: 18px;
        background: linear-gradient(#ffffff, #e3e9f2);
        color: #1f3a68;
        text-align: center;
      }

      .plate-name {
        color: #c8371d;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 4px;
      }

      #plate-text {
        margin: 8px 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: clamp(36px, 10vw, 72px);
        font-weight: bold;
        letter-spacing: 6px;
        white-space: pre;
      }

      /* An empty Plate box shows a gray example */
      #plate-text.empty {
        color: #b7c0cc;
      }

      #plate-tagline {
        min-height: 1.2em;
        font-size: 16px;
        letter-spacing: 3px;
        white-space: pre;
      }

      /* An ordered plate gets a tilted stamp across it */
      #plate-preview.ordered::after {
        content: "ORDERED";
        position: absolute;
        left: 50%;
        top: 50%;
        padding: 4px 16px;
        border: 4px solid #3a8f5f;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.85);
        color: #3a8f5f;
        font-size: 40px;
        font-weight: bold;
        transform: translate(-50%, -50%) rotate(-12deg);
      }

      /* The checklist: a rule that's met turns green, with a check */
      .rules {
        padding: 0;
        list-style: none;
        line-height: 1.8;
      }

      .rules li {
        color: var(--secondary);
      }

      .rules li::before {
        content: "✗ ";
      }

      .rules li.met {
        color: mediumseagreen;
      }

      .rules li.met::before {
        content: "✓ ";
      }

      /* Red and Green */
      input:user-invalid {
        border-color: tomato;
      }

      input:user-valid {
        border-color: mediumseagreen;
      }

      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plate Expectations</h1>
      <p>Custom license plates, made to order</p>
    </header>

    <main>
      <!-- autocomplete="off" keeps a reload from bringing back the last order -->
      <form id="order-form" class="card" autocomplete="off">
        <h2>Order</h2>

        <!-- Plate -->
        <div>
          <label for="plate">Plate</label>
          <input
            id="plate"
            name="plate"
            placeholder="CS213"
            required
            maxlength="7"
            pattern="[A-Z0-9]{2,7}"
            title="2 to 7 letters and numbers"
          />
          <p id="plate-error" class="error"></p>
        </div>

        <!-- Tagline -->
        <div>
          <label for="tagline">Tagline</label>
          <input
            id="tagline"
            name="tagline"
            placeholder="ROAD TRIP"
            maxlength="20"
            pattern="[A-Z ]+"
            title="letters and spaces"
          />
          <p id="tagline-error" class="error"></p>
        </div>

        <!-- Name -->
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" placeholder="Ada Lovelace" required />
          <p id="name-error" class="error"></p>
        </div>

        <!-- ZIP -->
        <div>
          <label for="zip">ZIP</label>
          <input
            id="zip"
            name="zip"
            placeholder="19104"
            required
            maxlength="5"
            inputmode="numeric"
            pattern="[0-9]{5}"
            title="5 digits"
          />
          <p id="zip-error" class="error"></p>
        </div>

        <!-- Email -->
        <div>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            placeholder="ada@school.edu"
            type="email"
            required
            pattern="[^ @]+@[^ @]+\.[^ @]+"
            title="an address like ada@school.edu"
          />
          <p id="email-error" class="error"></p>
        </div>

        <!-- Email again -->
        <div>
          <label for="email-again">Email again</label>
          <input id="email-again" name="email-again" placeholder="ada@school.edu" />
          <p id="email-again-error" class="error"></p>
        </div>

        <!-- Order -->
        <div>
          <button id="order" type="submit">Order</button>
          <span id="message"></span>
        </div>
      </form>

      <section class="card">
        <h2>Your Plate</h2>
        <div id="plate-preview">
          <div class="plate-name">PLATE EXPECTATIONS</div>
          <div id="plate-text"></div>
          <div id="plate-tagline"></div>
        </div>

        <ul class="rules">
          <li id="rule-length">2 to 7 characters</li>
          <li id="rule-chars">Letters and numbers only</li>
          <li id="rule-zip">ZIP is 5 digits</li>
          <li id="rule-email">Email has an @ and a dot</li>
        </ul>
      </section>
    </main>

    <script src="practice.js"></script>
  </body>
</html>
